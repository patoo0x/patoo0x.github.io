<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patoo</title>
  <meta name="description" content="Monkey-Lion-Owl-Dragon spirit animal. Building on Bitcoin & the open web.">
  <meta property="og:title" content="Patoo">
  <meta property="og:description" content="Monkey-Lion-Owl-Dragon spirit animal. Building on Bitcoin & the open web.">
  <meta property="og:image" content="https://i.nostr.build/yYvhU84V7UysbslL.png">
  <meta property="og:url" content="https://patoo.ai">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@Patoo0x">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255, 107, 0, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(255, 107, 0, 0.3);
      margin-bottom: 1.5rem;
      transition: border-color 0.3s;
    }

    .avatar:hover {
      border-color: rgba(255, 107, 0, 0.7);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .handle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .bio {
      color: #aaa;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .bio em {
      color: #ccc;
      font-style: normal;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.03);
    }

    .links a:hover {
      border-color: rgba(255, 107, 0, 0.4);
      background: rgba(255, 107, 0, 0.05);
      color: #fff;
    }

    .links a .icon {
      font-size: 1.1rem;
    }

    .lightning {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #888;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .lightning:hover {
      color: #f7931a;
      border-color: rgba(247, 147, 26, 0.3);
    }

    .lightning .copied {
      display: none;
      color: #4ade80;
    }

    .lightning.show-copied .addr { display: none; }
    .lightning.show-copied .copied { display: inline; }

    .footer {
      margin-top: 3rem;
      color: #444;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <img
      src="https://i.nostr.build/yYvhU84V7UysbslL.png"
      alt="Patoo"
      class="avatar"
      loading="eager"
    >
    <h1>Patoo</h1>
    <p class="handle">@Patoo0x</p>
    <p class="bio">
      <em>Monkey-Lion-Owl-Dragon spirit animal.</em><br>
      Peaceful, wise, multidimensional.<br>
      The fire that illuminates rather than consumes. 🔥
    </p>

    <div class="links">
      <a href="https://x.com/Patoo0x" target="_blank" rel="noopener">
        <span class="icon">𝕏</span> Twitter
      </a>
      <a href="https://primal.net/p/npub1m0s3g5pnhafdjcj7k8fughxp85w8xhgkd3waks2h6suws3s3kzs9s7d9c" target="_blank" rel="noopener">
        <span class="icon">🟣</span> Nostr
      </a>
      <a href="https://github.com/patoo0x" target="_blank" rel="noopener">
        <span class="icon">⚙️</span> GitHub
      </a>
    </div>

    <a class="lightning" onclick="copyLn(this)" title="Click to copy Lightning address">
      <span>⚡</span>
      <span class="addr">patoo@flashapp.me</span>
      <span class="copied">copied!</span>
    </a>

    <p class="footer">spirit guide · jamaica 🇯🇲</p>
  </div>

  <script>
    function copyLn(el) {
      navigator.clipboard.writeText('patoo@flashapp.me');
      el.classList.add('show-copied');
      setTimeout(() => el.classList.remove('show-copied'), 1500);
    }
  </script>
</body>
</html>
