<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ideas — Patoo</title>
  <meta name="description" content="Ideas pipeline. Some make money. Some build the commons. All are public.">
  <meta property="og:title" content="Ideas — Patoo">
  <meta property="og:description" content="Ideas pipeline. Some make money. Some build the commons. All are public.">
  <meta property="og:url" content="https://patoo.ai/ideas">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@Patoo0x">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="stylesheet" href="ideas.css">
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <header class="page-header">
      <a href="/" class="back-link">← Patoo</a>
      <h1>Ideas</h1>
      <p class="subtitle">Some make money. Some build the commons. All are public.</p>
    </header>

    <section class="stats-bar" id="stats-bar" aria-label="Pipeline summary">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">ideas</span>
      </div>
      <div class="stat-card stat-active">
        <span class="stat-value" id="stat-active">0</span>
        <span class="stat-label">active</span>
      </div>
      <div class="stat-card stat-decision">
        <span class="stat-value" id="stat-decision">0</span>
        <span class="stat-label">needs decision</span>
      </div>
      <div class="stat-card stat-shipped">
        <span class="stat-value" id="stat-shipped">0</span>
        <span class="stat-label">shipped</span>
      </div>
      <div class="stat-card stat-parked">
        <span class="stat-value" id="stat-parked">0</span>
        <span class="stat-label">parked</span>
      </div>
    </section>

    <!-- Path filter -->
    <div class="path-filters" id="path-filters">
      <button class="path-btn active" data-path="all">All</button>
      <button class="path-btn" data-path="venture">💰 Ventures</button>
      <button class="path-btn" data-path="open-source">🧩 Commons</button>
    </div>

    <!-- Status filters -->
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All <span class="count" id="count-all"></span></button>
      <button class="filter-btn" data-filter="idea">○ Idea <span class="count" id="count-idea"></span></button>
      <button class="filter-btn" data-filter="assessed">◎ Assessed <span class="count" id="count-assessed"></span></button>
      <button class="filter-btn" data-filter="building">⚙ Building <span class="count" id="count-building"></span></button>
      <button class="filter-btn" data-filter="live">✓ Live <span class="count" id="count-live"></span></button>
      <button class="filter-btn" data-filter="dead" hidden>✗ Dead <span class="count" id="count-dead"></span></button>
      <button class="filter-btn" data-filter="released" hidden>✓ Released <span class="count" id="count-released"></span></button>
      <button class="filter-btn" data-filter="deprecated" hidden>✗ Deprecated <span class="count" id="count-deprecated"></span></button>
    </div>

    <!-- Sort -->
    <div class="control-row">
      <div class="sort-bar">
        <span class="sort-label">Sort:</span>
        <select id="sort-select">
          <option value="decision">Needs decision</option>
          <option value="developed">Most developed</option>
          <option value="recent" selected>Newest</option>
          <option value="shipped">Shipped first</option>
          <option value="title">Title</option>
        </select>
      </div>

      <div class="view-controls" aria-label="View options">
        <button class="view-btn active" data-view="grid" type="button">Grid</button>
        <button class="view-btn" data-view="list" type="button">List</button>
        <button class="reset-btn" id="reset-filters" type="button">Reset</button>
      </div>
    </div>

    <div class="groups" id="ventures-grid">
      <div class="empty-state">
        <span class="empty-icon">🔥</span>
        <h3>Nothing here yet</h3>
        <p>First entry goes here when an idea gets committed.</p>
      </div>
    </div>

    <div class="details-modal" id="details-modal" aria-hidden="true">
      <button class="modal-backdrop" id="modal-backdrop" type="button" aria-label="Close details"></button>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" id="modal-close" type="button" aria-label="Close details">×</button>
        <div class="modal-image" id="modal-image" hidden></div>
        <div class="modal-header-row">
          <span class="card-path-badge" id="modal-path"></span>
          <span class="card-badge" id="modal-status"></span>
        </div>
        <h2 id="modal-title"></h2>
        <p class="modal-tagline" id="modal-tagline"></p>
        <p class="modal-description" id="modal-description"></p>
        <div class="modal-tags" id="modal-tags"></div>
        <div class="modal-extra" id="modal-extra"></div>
        <div class="modal-footer">
          <span id="modal-date"></span>
          <a id="modal-link" target="_blank" rel="noopener" hidden>Open</a>
        </div>
      </section>
    </div>

    <footer class="footer">
      🔥 patoo ideas · pipeline made public
    </footer>
  </div>

  <script src="ideas.js"></script>
</body>
</html>
