<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon Leg Style Test — patoo.ai</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }

    #dragon-canvas {
      position: fixed; inset: 0;
      width: 100% !important; height: 100% !important;
      pointer-events: none; z-index: 0; opacity: 0.22;
    }

    .content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      color: #fff; font-family: sans-serif; text-align: center; gap: 1rem;
    }
    .content h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; }
    .content p  { color: rgba(255,255,255,0.45); font-size: 1rem; }

    #hud {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      background: rgba(10,10,10,0.80); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 1.2rem; padding: 0.8rem 1.6rem; backdrop-filter: blur(8px);
      user-select: none; text-align: center;
    }
    .hud-row { display: flex; align-items: center; gap: 1rem; }
    #hud button {
      background: none; border: none; color: rgba(255,255,255,0.55);
      font-size: 1.1rem; cursor: pointer; padding: 0 0.2rem; transition: color 0.15s;
    }
    #hud button:hover { color: #fff; }
    #leg-name {
      color: #fff; font-family: sans-serif; font-size: 0.82rem;
      letter-spacing: 0.10em; text-transform: uppercase;
      min-width: 220px; text-align: center;
    }
    #leg-desc {
      color: rgba(255,255,255,0.35); font-family: sans-serif; font-size: 0.70rem;
      min-width: 220px; text-align: center; font-style: italic;
    }
    #leg-num { color: rgba(255,255,255,0.25); font-family: sans-serif; font-size: 0.68rem; }
    #hint {
      position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.2); font-family: sans-serif; font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase; z-index: 10;
    }
  </style>
</head>
<body>
<canvas id="dragon-canvas"></canvas>
<div class="content">
  <h1>Patoo</h1>
  <p>@Patoo0x · Monkey-Lion-Owl-Dragon spirit animal.</p>
  <p>⚡ Zap · Nostr · GitHub</p>
</div>
<div id="hint">← → to cycle leg styles</div>
<div id="hud">
  <div class="hud-row">
    <button id="prev">&#8592;</button>
    <span id="leg-name">Solid Phong</span>
    <button id="next">&#8594;</button>
  </div>
  <div id="leg-desc">standard solid shading</div>
  <div id="leg-num">1 / 6</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function () {
  'use strict';

  // ── Obsidian + Violet body (locked) ──────────────────────────────────────
  const BODY = {
    ambient: 0xb0a0c8, dir1: 0xf0e8ff, dir2: 0x8060c0, rim: 0xd0b8f0,
    head:  { color: 0x6040a8, specular: 0xe8c0ff, shininess: 280, emissive: 0x100818, ei: 0.48 },
    body:  { color: 0x4a2e88, specular: 0xc090e8, shininess: 220, emissive: 0x0c0614, ei: 0.44 },
    tail:  { color: 0x583498, specular: 0xd0a8f8, shininess: 260, emissive: 0x0e0618, ei: 0.46 },
  };

  // ── Leg style definitions ─────────────────────────────────────────────────
  // Each style is applied when selected — buildLegMaterials() rebuilds the
  // materials and applyLegStyle() patches jiao meshes in place.
  const LEG_STYLES = [
    {
      name: 'Solid Crimson',
      desc: 'Standard Phong — same style as body but red',
      build: () => new THREE.MeshPhongMaterial({
        color: 0x8b1818, specular: 0xff4040, shininess: 180,
        emissive: 0x250000, emissiveIntensity: 0.55,
      }),
      scaleX: 0.12, scaleY: 0.12, scaleZ: 0.12,
      visible: true,
    },
    {
      name: 'PBR Metallic',
      desc: 'MeshStandardMaterial — physically realistic metal surface',
      build: () => new THREE.MeshStandardMaterial({
        color: 0x6040a8, metalness: 0.92, roughness: 0.12,
        emissive: 0x200840, emissiveIntensity: 0.30,
      }),
      scaleX: 0.14, scaleY: 0.14, scaleZ: 0.14,
      visible: true,
    },
    {
      name: 'Long Claws',
      desc: 'Geometry stretched — elongated, claw-like proportions',
      build: () => new THREE.MeshPhongMaterial({
        color: 0x6040a8, specular: 0xe8c0ff, shininess: 220,
        emissive: 0x100818, emissiveIntensity: 0.48,
      }),
      scaleX: 0.10, scaleY: 0.10, scaleZ: 0.22,  // stretched on Z
      visible: true,
    },
    {
      name: 'Glowing Energy',
      desc: 'Additive blending — legs appear as luminous energy tendrils',
      build: () => new THREE.MeshPhongMaterial({
        color: 0xc060ff, specular: 0xffffff, shininess: 400,
        emissive: 0x8030e0, emissiveIntensity: 1.8,
        blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85,
      }),
      scaleX: 0.13, scaleY: 0.13, scaleZ: 0.13,
      visible: true,
    },
    {
      name: 'Wireframe',
      desc: 'Structural skeleton — just the edge lines of the mesh',
      build: () => new THREE.MeshBasicMaterial({
        color: 0xc090ff, wireframe: true, transparent: true, opacity: 0.65,
      }),
      scaleX: 0.14, scaleY: 0.14, scaleZ: 0.14,
      visible: true,
    },
    {
      name: 'No Legs',
      desc: 'Pure serpent — minimal, no limbs',
      build: () => new THREE.MeshPhongMaterial({ color: 0x000000 }),
      scaleX: 0.12, scaleY: 0.12, scaleZ: 0.12,
      visible: false,
    },
  ];

  let currentStyle = 0;

  // ── Renderer ────────────────────────────────────────────────────────────
  const cv = document.getElementById('dragon-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
  camera.position.set(3, 0.15, 3);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── Lights ───────────────────────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(BODY.ambient, 2.2));
  const d1 = new THREE.DirectionalLight(BODY.dir1, 5.0); d1.position.set(8,15,10); scene.add(d1);
  const d2 = new THREE.DirectionalLight(BODY.dir2, 1.8); d2.position.set(-12,-5,-8); scene.add(d2);
  const d3 = new THREE.DirectionalLight(BODY.rim,  2.2); d3.position.set(0,5,-15);  scene.add(d3);

  // ── Materials ─────────────────────────────────────────────────────────────
  const mk = d => new THREE.MeshPhongMaterial({
    color: d.color, specular: d.specular, shininess: d.shininess,
    emissive: d.emissive, emissiveIntensity: d.ei
  });

  const matHead = mk(BODY.head);
  const matTail = mk(BODY.tail);

  // ── Meshes ────────────────────────────────────────────────────────────────
  const loader = new THREE.STLLoader();
  let tou, wei;
  const jiao  = [];
  const meshB = [];
  const BNUM  = 14;

  loader.load('./tou.stl', geo => {
    tou = new THREE.Mesh(geo, matHead);
    tou.scale.set(0.15,0.15,0.15);
    tou.rotation.set(-Math.PI/2, 0, 0);
    scene.add(tou);
  });

  loader.load('./wei.stl', geo => {
    wei = new THREE.Mesh(geo, matTail);
    wei.scale.set(0.11,0.11,0.11);
    wei.rotation.set(-Math.PI/2, 0, 0);
    scene.add(wei);
  });

  // Load legs — stagger requests slightly so all 4 load correctly
  for (let i = 0; i < 4; i++) {
    loader.load((i === 0 || i === 2) ? './jiao.stl' : './jiao2.stl', geo => {
      const s = LEG_STYLES[0];
      const m = new THREE.Mesh(geo, s.build());
      m.scale.set(s.scaleX, s.scaleY, s.scaleZ);
      m.rotation.set(-Math.PI/2, 0, -Math.PI/2);
      jiao.push(m);
      scene.add(m);
    });
  }

  for (let i = 0; i < BNUM; i++) {
    loader.load('./bodyy.stl', geo => {
      const m = new THREE.Mesh(geo, mk(BODY.body));
      m.scale.set(0.2, 0.1, 0.2);
      m.rotation.set(-Math.PI/2, 0, 0);
      meshB.push(m);
      scene.add(m);
    });
  }

  // ── Apply leg style ───────────────────────────────────────────────────────
  function applyLegStyle(idx) {
    const s = LEG_STYLES[idx];
    jiao.forEach(m => {
      // Dispose old material, apply new
      if (m.material) m.material.dispose();
      m.material = s.build();
      m.scale.set(s.scaleX, s.scaleY, s.scaleZ);
      m.visible  = s.visible;
    });
    document.getElementById('leg-name').textContent = s.name;
    document.getElementById('leg-desc').textContent = s.desc;
    document.getElementById('leg-num').textContent  = `${idx + 1} / ${LEG_STYLES.length}`;
  }

  // ── Controls ──────────────────────────────────────────────────────────────
  function go(dir) {
    currentStyle = (currentStyle + dir + LEG_STYLES.length) % LEG_STYLES.length;
    applyLegStyle(currentStyle);
  }
  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(+1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  go(-1);
    if (e.key === 'ArrowRight') go(+1);
  });

  // ── Animation ─────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function render() {
    const T = clock.getElapsedTime();

    if (tou) {
      const t = 0.2*(T+0.6);
      tou.position.set(Math.cos(t)*15, Math.cos(3*t)-4.5, Math.sin(t)*15);
      tou.rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      tou.rotation.z = -t;
    }

    if (jiao.length === 4) {
      const doLeg = (m, lag, r) => {
        if (!m.visible) return;
        const t = 0.2*(T-lag);
        m.position.set(Math.cos(t)*r, Math.cos(3*t)-7, Math.sin(t)*r);
        m.rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
        m.rotation.z = -t;
      };
      doLeg(jiao[0], 1.5, 17); doLeg(jiao[1], 1.5, 13);
      doLeg(jiao[2], 4.5, 17); doLeg(jiao[3], 4.5, 13);
    }

    for (let i = 0; i < meshB.length; i++) {
      const t = 0.2*(T-0.6*i);
      if (i > 8) {
        meshB[i].scale.x = 0.2-(i-8)*0.015;
        meshB[i].scale.z = 0.2-(i-8)*0.015;
        meshB[i].scale.y = (0.2-(i-8)*0.02)*(0.3-0.07*Math.abs(Math.cos(3*t)));
      } else {
        meshB[i].scale.y = 0.3-0.07*Math.abs(Math.cos(3*t));
      }
      meshB[i].position.set(Math.cos(t)*15, Math.cos(3*t)-5, Math.sin(t)*15);
      meshB[i].rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      meshB[i].rotation.z = -t;
    }

    if (wei) {
      const t = 0.2*(T-0.6*BNUM+0.1);
      wei.position.set(Math.cos(t)*15, Math.cos(3*t)-5, Math.sin(t)*15);
      wei.rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      wei.rotation.z = -t;
    }

    camera.position.x = 30+Math.cos(0.3*T)*5;
    camera.position.y = Math.sin(0.3*T)*5-5;
    camera.lookAt(new THREE.Vector3(0,-5,0));
    renderer.render(scene, camera);
  }

  function animate() { requestAnimationFrame(animate); render(); }
  animate();
})();
</script>
</body>
</html>
