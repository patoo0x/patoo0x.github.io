<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon Test — patoo.ai</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }

    #dragon-canvas {
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none;
      z-index: 0;
      opacity: 0.20;  /* transparency level — adjust here */
    }

    /* Sample page content so we can test contrast */
    .content {
      position: relative;
      z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      color: #fff; font-family: sans-serif; text-align: center;
      gap: 1rem;
    }
    .content h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; }
    .content p  { color: rgba(255,255,255,0.45); font-size: 1rem; }
  </style>
</head>
<body>

<!-- Three.js WebGL dragon — transparent overlay -->
<canvas id="dragon-canvas"></canvas>

<!-- Test content underneath -->
<div class="content">
  <h1>Patoo</h1>
  <p>@Patoo0x · Monkey-Lion-Owl-Dragon spirit animal.</p>
  <p>⚡ Zap · Nostr · GitHub</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="./STLLoader.js"></script>
<script>
(function () {
  'use strict';

  // ─────────────────────────────────────────────────────────────────────────
  // RENDERER — transparent background so page shows through
  // ─────────────────────────────────────────────────────────────────────────
  const canvas = document.getElementById('dragon-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);  // fully transparent clear

  // ─────────────────────────────────────────────────────────────────────────
  // SCENE + CAMERA
  // ─────────────────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
  camera.position.set(3, 0.15, 3);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ─────────────────────────────────────────────────────────────────────────
  // LIGHTING — warm copper tones
  // ─────────────────────────────────────────────────────────────────────────
  const ambientLight = new THREE.AmbientLight(0xffd0a0, 1.8);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffe8c0, 4.5);
  dirLight1.position.set(8, 15, 10);
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0xff6020, 2.2);
  dirLight2.position.set(-12, -5, -8);
  scene.add(dirLight2);

  const rimLight = new THREE.DirectionalLight(0xffa050, 1.8);
  rimLight.position.set(0, 5, -15);
  scene.add(rimLight);

  // ─────────────────────────────────────────────────────────────────────────
  // MATERIALS — replicate the copper/red BRDF shaders with Phong
  // ─────────────────────────────────────────────────────────────────────────
  const matHead = new THREE.MeshPhongMaterial({
    color:    0xd4762a,
    specular: 0xffe0a0,
    shininess: 220,
    emissive: 0x2a0c00,
    emissiveIntensity: 0.5
  });

  const matBody = new THREE.MeshPhongMaterial({
    color:    0xb35218,
    specular: 0xd4a050,
    shininess: 180,
    emissive: 0x1e0800,
    emissiveIntensity: 0.45
  });

  const matLegs = new THREE.MeshPhongMaterial({
    color:    0x8b1818,
    specular: 0xff5030,
    shininess: 140,
    emissive: 0x1a0000,
    emissiveIntensity: 0.45
  });

  const matTail = new THREE.MeshPhongMaterial({
    color:    0xc56820,
    specular: 0xffc060,
    shininess: 200,
    emissive: 0x250a00,
    emissiveIntensity: 0.48
  });

  // ─────────────────────────────────────────────────────────────────────────
  // LOAD STL MESHES
  // ─────────────────────────────────────────────────────────────────────────
  const loader = new THREE.STLLoader();
  let tou, wei;
  const jiao  = [];
  const meshB = [];
  const BNUM  = 14;
  let ready   = false;
  let loaded  = 0;

  function onLoad() {
    loaded++;
    if (loaded === 3 + BNUM) { ready = true; }
  }

  // Head
  loader.load('./tou.stl', geo => {
    tou = new THREE.Mesh(geo, matHead);
    tou.scale.set(0.15, 0.15, 0.15);
    tou.rotation.set(-Math.PI / 2, 0, 0);
    scene.add(tou);
    onLoad();
  });

  // Tail
  loader.load('./wei.stl', geo => {
    wei = new THREE.Mesh(geo, matTail);
    wei.scale.set(0.11, 0.11, 0.11);
    wei.rotation.set(-Math.PI / 2, 0, 0);
    scene.add(wei);
    onLoad();
  });

  // Legs (2 pairs)
  for (let i = 0; i < 4; i++) {
    const file = (i === 0 || i === 2) ? './jiao.stl' : './jiao2.stl';
    loader.load(file, geo => {
      const m = new THREE.Mesh(geo, matLegs);
      m.scale.set(0.12, 0.12, 0.12);
      m.rotation.set(-Math.PI / 2, 0, -Math.PI / 2);
      jiao.push(m);
      scene.add(m);
    });
  }

  // Body segments
  for (let i = 0; i < BNUM; i++) {
    loader.load('./bodyy.stl', geo => {
      const m = new THREE.Mesh(geo, matBody.clone());
      m.scale.set(0.2, 0.1, 0.2);
      m.rotation.set(-Math.PI / 2, 0, 0);
      meshB.push(m);
      scene.add(m);
      onLoad();
    });
  }

  // ─────────────────────────────────────────────────────────────────────────
  // ANIMATION — identical to test2.js render()
  // ─────────────────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();
  const base  = Math.sqrt(30 * 30 + 3 * 3);

  function render() {
    const timeR = clock.getElapsedTime();

    // ── HEAD ──
    const thetat = 0.2 * (timeR + 0.6);
    if (tou) {
      tou.position.x = Math.cos(thetat) * 15;
      tou.position.z = Math.sin(thetat) * 15;
      tou.position.y = Math.cos(3 * thetat) * 1 - 5 + 0.5;
      tou.rotation.y = Math.sin(thetat) > 0
        ? -Math.atan(Math.sin(3 * thetat) * 2 * 3 / 15)
        :  Math.atan(Math.sin(3 * thetat) * 2 * 3 / 15);
      tou.rotation.z = -thetat;
    }

    // ── LEGS ──
    if (jiao.length === 4) {
      let thetaj = 0.2 * (timeR - 1.5);
      const posLeg = (m, r) => {
        m.position.x = Math.cos(thetaj) * r;
        m.position.z = Math.sin(thetaj) * r;
        m.position.y = Math.cos(3 * thetaj) * 1 - 2 - 5;
        m.rotation.y = Math.sin(thetaj) > 0
          ? -Math.atan(Math.sin(3 * thetaj) * 2 * 3 / 15)
          :  Math.atan(Math.sin(3 * thetaj) * 2 * 3 / 15);
        m.rotation.z = -thetaj;
      };
      posLeg(jiao[0], 17); posLeg(jiao[1], 13);
      thetaj = 0.2 * (timeR - 4.5);
      posLeg(jiao[2], 17); posLeg(jiao[3], 13);
    }

    // ── BODY SEGMENTS ──
    for (let i = 0; i < meshB.length; i++) {
      const time  = timeR - 0.6 * i;
      const theta = 0.2 * time;
      if (i > 8) {
        meshB[i].scale.x = 0.2 - (i - 8) * 0.015;
        meshB[i].scale.z = 0.2 - (i - 8) * 0.015;
        meshB[i].scale.y = 0.2 - (i - 8) * 0.02 * (0.3 - 0.07 * Math.abs(Math.cos(3 * theta)));
      } else {
        meshB[i].scale.y = 0.3 - 0.07 * Math.abs(Math.cos(3 * theta));
      }
      meshB[i].position.x = Math.cos(theta) * 15;
      meshB[i].position.z = Math.sin(theta) * 15;
      meshB[i].position.y = Math.cos(3 * theta) * 1 - 5;
      meshB[i].rotation.y = Math.sin(theta) > 0
        ? -Math.atan(Math.sin(3 * theta) * 2 * 3 / 15)
        :  Math.atan(Math.sin(3 * theta) * 2 * 3 / 15);
      meshB[i].rotation.z = -theta;
    }

    // ── TAIL ──
    if (wei) {
      const thetaw = 0.2 * (timeR - 0.6 * BNUM + 0.1);
      wei.position.x = Math.cos(thetaw) * 15;
      wei.position.z = Math.sin(thetaw) * 15;
      wei.position.y = Math.cos(3 * thetaw) * 1 - 5 + 0.5 - 0.5;
      wei.rotation.y = Math.sin(thetaw) > 0
        ? -Math.atan(Math.sin(3 * thetaw) * 2 * 3 / 15)
        :  Math.atan(Math.sin(3 * thetaw) * 2 * 3 / 15);
      wei.rotation.z = -thetaw;
    }

    // ── CAMERA ORBIT (same as reference) ──
    const time = clock.getElapsedTime();
    camera.position.x = 30 + Math.cos(0.3 * time) * 5;
    camera.position.y = Math.sin(0.3 * time) * 5 - 5;
    camera.lookAt(new THREE.Vector3(0, 0, 0));

    renderer.render(scene, camera);
  }

  function animate() {
    requestAnimationFrame(animate);
    render();
  }

  animate();
})();
</script>
</body>
</html>
