<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon Leg Attachment Test — patoo.ai</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }
    #dragon-canvas {
      position: fixed; inset: 0; width: 100% !important; height: 100% !important;
      pointer-events: none; z-index: 0; opacity: 0.22;
    }
    .content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      color: #fff; font-family: sans-serif; text-align: center; gap: 1rem;
    }
    .content h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; }
    .content p  { color: rgba(255,255,255,0.45); font-size: 1rem; }
    #hud {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      background: rgba(10,10,10,0.82); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 1.2rem; padding: 0.8rem 1.6rem; backdrop-filter: blur(8px); text-align: center;
    }
    .hud-row { display: flex; align-items: center; gap: 1rem; }
    #hud button {
      background: none; border: none; color: rgba(255,255,255,0.55);
      font-size: 1.1rem; cursor: pointer; transition: color 0.15s;
    }
    #hud button:hover { color: #fff; }
    #leg-name { color: #fff; font-family: sans-serif; font-size: 0.82rem; letter-spacing: 0.10em; text-transform: uppercase; min-width: 240px; }
    #leg-desc { color: rgba(255,255,255,0.38); font-family: sans-serif; font-size: 0.70rem; min-width: 240px; font-style: italic; }
    #leg-num  { color: rgba(255,255,255,0.25); font-family: sans-serif; font-size: 0.68rem; }
    #hint { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.2); font-family: sans-serif; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; z-index: 10; }
  </style>
</head>
<body>
<canvas id="dragon-canvas"></canvas>
<div class="content">
  <h1>Patoo</h1>
  <p>@Patoo0x · Monkey-Lion-Owl-Dragon spirit animal.</p>
  <p>⚡ Zap · Nostr · GitHub</p>
</div>
<div id="hint">← → to cycle attachment styles</div>
<div id="hud">
  <div class="hud-row">
    <button id="prev">&#8592;</button>
    <span id="leg-name">Loading…</span>
    <button id="next">&#8594;</button>
  </div>
  <div id="leg-desc"></div>
  <div id="leg-num">1 / 4</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function () {
  'use strict';

  // ── Obsidian + Violet body (locked) ──────────────────────────────────────
  const BODY_SCHEME = {
    ambient: 0xb0a0c8, dir1: 0xf0e8ff, dir2: 0x8060c0, rim: 0xd0b8f0,
    head:  { color: 0x6040a8, specular: 0xe8c0ff, shininess: 280, emissive: 0x100818, ei: 0.48 },
    body:  { color: 0x4a2e88, specular: 0xc090e8, shininess: 220, emissive: 0x0c0614, ei: 0.44 },
    tail:  { color: 0x583498, specular: 0xd0a8f8, shininess: 260, emissive: 0x0e0618, ei: 0.46 },
  };

  // Leg segments: which body segment indices the legs attach to
  const LEG_SEG_A = 2;   // front pair
  const LEG_SEG_B = 7;   // rear pair

  // ── Attachment styles ────────────────────────────────────────────────────
  // Each defines HOW legs are positioned relative to the body segment
  const ATTACH_STYLES = [
    {
      name: 'Reference (floating)',
      desc: 'Original algorithm — independent orbit at different radii',
      positionLegs(jiao, T, segPos) {
        // Original test2.js approach: separate orbit at r=17 and r=13
        const doLeg = (m, lag, r) => {
          const t = 0.2*(T - lag);
          m.position.set(Math.cos(t)*r, Math.cos(3*t)-7, Math.sin(t)*r);
          m.rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
          m.rotation.z = -t;
        };
        doLeg(jiao[0], 1.5, 17); doLeg(jiao[1], 1.5, 13);
        doLeg(jiao[2], 4.5, 17); doLeg(jiao[3], 4.5, 13);
      },
    },
    {
      name: 'Pinned to Segments — Radial',
      desc: 'Legs locked to body segs 2 & 7, offset along outward radial direction',
      positionLegs(jiao, T, segPos) {
        // Front pair: attached to body segment LEG_SEG_A
        this._attachPair(jiao[0], jiao[1], segPos[LEG_SEG_A], T - 0.6*LEG_SEG_A, 3.5, -2.0);
        // Rear pair: attached to body segment LEG_SEG_B
        this._attachPair(jiao[2], jiao[3], segPos[LEG_SEG_B], T - 0.6*LEG_SEG_B, 3.5, -2.0);
      },
      _attachPair(outer, inner, seg, tSeg, radialOffset, yOffset) {
        if (!seg) return;
        const t = 0.2 * tSeg;
        // Radial outward unit vector in XZ: (cos θ, 0, sin θ)
        const rx = Math.cos(t), rz = Math.sin(t);
        // Tangent direction for leg rotation
        const rotY  = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);

        // Outer leg: body position + radial offset outward
        outer.position.set(
          seg.x + rx * radialOffset,
          seg.y + yOffset,
          seg.z + rz * radialOffset
        );
        outer.rotation.y = rotY;
        outer.rotation.z = -t;

        // Inner leg: body position - radial offset (toward center)
        inner.position.set(
          seg.x - rx * radialOffset,
          seg.y + yOffset,
          seg.z - rz * radialOffset
        );
        inner.rotation.y = rotY;
        inner.rotation.z = -t + Math.PI; // flip to face inward
      },
    },
    {
      name: 'Pinned — Both Sides Visible',
      desc: 'Both legs on same side, spaced along body segment, facing outward',
      positionLegs(jiao, T, segPos) {
        this._attachSide(jiao[0], jiao[1], segPos, LEG_SEG_A, T, 4.0, -1.5,  1.5);
        this._attachSide(jiao[2], jiao[3], segPos, LEG_SEG_B, T, 4.0, -1.5, -1.5);
      },
      _attachSide(legA, legB, segPos, segIdx, T, radialOffset, yOffset, zSpread) {
        if (!segPos[segIdx]) return;
        const t   = 0.2 * (T - 0.6 * segIdx);
        const rx  = Math.cos(t), rz = Math.sin(t);
        // Tangent direction: perpendicular to radial in XZ
        const tx  = -Math.sin(t), tz = Math.cos(t);
        const rotY = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
        const seg  = segPos[segIdx];

        // Both legs on outer side, spread along body tangent
        legA.position.set(
          seg.x + rx*radialOffset + tx*zSpread,
          seg.y + yOffset,
          seg.z + rz*radialOffset + tz*zSpread
        );
        legA.rotation.y = rotY; legA.rotation.z = -t;

        legB.position.set(
          seg.x + rx*radialOffset - tx*zSpread,
          seg.y + yOffset,
          seg.z + rz*radialOffset - tz*zSpread
        );
        legB.rotation.y = rotY; legB.rotation.z = -t;
      },
    },
    {
      name: 'Tight Attach — Flat to Body',
      desc: 'Legs flush against body, minimal gap, spread only by tangent offset',
      positionLegs(jiao, T, segPos) {
        this._flatPair(jiao[0], jiao[1], segPos, LEG_SEG_A, T,  2.0, -0.8);
        this._flatPair(jiao[2], jiao[3], segPos, LEG_SEG_B, T,  2.0, -0.8);
      },
      _flatPair(legA, legB, segPos, segIdx, T, radialOffset, yOffset) {
        if (!segPos[segIdx]) return;
        const t   = 0.2 * (T - 0.6 * segIdx);
        const rx  = Math.cos(t), rz = Math.sin(t);
        // Tangent for spreading legs front/back along body
        const tx  = -Math.sin(t) * 1.8, tz = Math.cos(t) * 1.8;
        const rotY = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
        const seg  = segPos[segIdx];

        legA.position.set(
          seg.x + rx*radialOffset + tx,
          seg.y + yOffset,
          seg.z + rz*radialOffset + tz
        );
        legA.rotation.y = rotY; legA.rotation.z = -t;

        legB.position.set(
          seg.x - rx*radialOffset - tx,
          seg.y + yOffset,
          seg.z - rz*radialOffset - tz
        );
        legB.rotation.y = rotY + Math.PI; legB.rotation.z = -t;
      },
    },
  ];

  let currentStyle = 0;

  // ── Renderer ─────────────────────────────────────────────────────────────
  const cv = document.getElementById('dragon-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
  camera.position.set(3, 0.15, 3);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ── Lights ───────────────────────────────────────────────────────────────
  const B = BODY_SCHEME;
  scene.add(new THREE.AmbientLight(B.ambient, 2.2));
  const d1 = new THREE.DirectionalLight(B.dir1, 5.0); d1.position.set(8,15,10);   scene.add(d1);
  const d2 = new THREE.DirectionalLight(B.dir2, 1.8); d2.position.set(-12,-5,-8); scene.add(d2);
  const d3 = new THREE.DirectionalLight(B.rim,  2.2); d3.position.set(0,5,-15);   scene.add(d3);

  // ── Materials ─────────────────────────────────────────────────────────────
  const mkPhong = d => new THREE.MeshPhongMaterial({
    color: d.color, specular: d.specular, shininess: d.shininess,
    emissive: d.emissive, emissiveIntensity: d.ei
  });
  const matHead = mkPhong(B.head);
  const matTail = mkPhong(B.tail);
  const matLegs = mkPhong({ color: 0x8b1818, specular: 0xff4040, shininess: 180, emissive: 0x250000, ei: 0.55 });

  // ── Meshes ────────────────────────────────────────────────────────────────
  const loader = new THREE.STLLoader();
  let tou, wei;
  const jiao  = [];
  const meshB = [];
  const BNUM  = 14;
  // segPos stores computed world positions of body segments each frame
  const segPos = new Array(BNUM).fill(null).map(() => new THREE.Vector3());

  loader.load('./tou.stl', geo => {
    tou = new THREE.Mesh(geo, matHead);
    tou.scale.set(0.15, 0.15, 0.15);
    tou.rotation.set(-Math.PI/2, 0, 0);
    scene.add(tou);
  });

  loader.load('./wei.stl', geo => {
    wei = new THREE.Mesh(geo, matTail);
    wei.scale.set(0.11, 0.11, 0.11);
    wei.rotation.set(-Math.PI/2, 0, 0);
    scene.add(wei);
  });

  for (let i = 0; i < 4; i++) {
    loader.load((i===0||i===2) ? './jiao.stl' : './jiao2.stl', geo => {
      const m = new THREE.Mesh(geo, matLegs);
      m.scale.set(0.14, 0.14, 0.14);
      m.rotation.set(-Math.PI/2, 0, -Math.PI/2);
      jiao.push(m);
      scene.add(m);
    });
  }

  for (let i = 0; i < BNUM; i++) {
    loader.load('./bodyy.stl', geo => {
      const m = new THREE.Mesh(geo, mkPhong(B.body));
      m.scale.set(0.2, 0.1, 0.2);
      m.rotation.set(-Math.PI/2, 0, 0);
      meshB.push(m);
      scene.add(m);
    });
  }

  // ── Controls ──────────────────────────────────────────────────────────────
  function updateHUD() {
    const s = ATTACH_STYLES[currentStyle];
    document.getElementById('leg-name').textContent = s.name;
    document.getElementById('leg-desc').textContent = s.desc;
    document.getElementById('leg-num').textContent  = `${currentStyle+1} / ${ATTACH_STYLES.length}`;
  }
  function go(dir) {
    currentStyle = (currentStyle + dir + ATTACH_STYLES.length) % ATTACH_STYLES.length;
    updateHUD();
  }
  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(+1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  go(-1);
    if (e.key === 'ArrowRight') go(+1);
  });
  updateHUD();

  // ── Animation ─────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function render() {
    const T = clock.getElapsedTime();

    // Head
    if (tou) {
      const t = 0.2*(T+0.6);
      tou.position.set(Math.cos(t)*15, Math.cos(3*t)-4.5, Math.sin(t)*15);
      tou.rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      tou.rotation.z = -t;
    }

    // Body segments — also record positions for leg attachment
    for (let i = 0; i < meshB.length; i++) {
      const t = 0.2*(T - 0.6*i);
      const px = Math.cos(t)*15, py = Math.cos(3*t)-5, pz = Math.sin(t)*15;
      if (i > 8) {
        meshB[i].scale.x = 0.2-(i-8)*0.015;
        meshB[i].scale.z = 0.2-(i-8)*0.015;
        meshB[i].scale.y = (0.2-(i-8)*0.02)*(0.3-0.07*Math.abs(Math.cos(3*t)));
      } else {
        meshB[i].scale.y = 0.3-0.07*Math.abs(Math.cos(3*t));
      }
      meshB[i].position.set(px, py, pz);
      meshB[i].rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      meshB[i].rotation.z = -t;
      // Store for leg attachment
      segPos[i] = { x: px, y: py, z: pz };
    }

    // Legs — positioned by current attachment style
    if (jiao.length === 4) {
      ATTACH_STYLES[currentStyle].positionLegs(jiao, T, segPos);
    }

    // Tail
    if (wei) {
      const t = 0.2*(T - 0.6*BNUM + 0.1);
      wei.position.set(Math.cos(t)*15, Math.cos(3*t)-5, Math.sin(t)*15);
      wei.rotation.y = Math.sin(t)>0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      wei.rotation.z = -t;
    }

    camera.position.x = 30+Math.cos(0.3*T)*5;
    camera.position.y = Math.sin(0.3*T)*5 - 5;
    camera.lookAt(new THREE.Vector3(0,-5,0));
    renderer.render(scene, camera);
  }

  function animate() { requestAnimationFrame(animate); render(); }
  animate();
})();
</script>
</body>
</html>
