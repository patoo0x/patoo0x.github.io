<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon Leg Test — patoo.ai</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }

    #dragon-canvas {
      position: fixed; inset: 0;
      width: 100% !important; height: 100% !important;
      pointer-events: none; z-index: 0;
      opacity: 0.22;
    }

    .content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      color: #fff; font-family: sans-serif; text-align: center; gap: 1rem;
    }
    .content h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; }
    .content p  { color: rgba(255,255,255,0.45); font-size: 1rem; }

    #hud {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; align-items: center; gap: 1rem;
      background: rgba(10,10,10,0.75); border: 1px solid rgba(255,255,255,0.10);
      border-radius: 2rem; padding: 0.6rem 1.2rem; backdrop-filter: blur(8px);
      user-select: none;
    }
    #hud button {
      background: none; border: none; color: rgba(255,255,255,0.55);
      font-size: 1.1rem; cursor: pointer; padding: 0 0.2rem; transition: color 0.15s;
    }
    #hud button:hover { color: #fff; }
    #leg-name {
      color: #fff; font-family: sans-serif; font-size: 0.78rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      min-width: 200px; text-align: center;
    }
    #leg-num { color: rgba(255,255,255,0.3); font-family: sans-serif; font-size: 0.72rem; }
    #hint {
      position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.2); font-family: sans-serif; font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase; z-index: 10;
    }
    #body-label {
      position: fixed; top: 1.5rem; right: 2rem;
      color: rgba(200,160,255,0.35); font-family: sans-serif; font-size: 0.68rem;
      letter-spacing: 0.08em; text-transform: uppercase; z-index: 10;
    }
  </style>
</head>
<body>

<canvas id="dragon-canvas"></canvas>

<div class="content">
  <h1>Patoo</h1>
  <p>@Patoo0x · Monkey-Lion-Owl-Dragon spirit animal.</p>
  <p>⚡ Zap · Nostr · GitHub</p>
</div>

<div id="hint">← → arrow keys or click to cycle leg styles</div>
<div id="body-label">Body: Obsidian + Violet</div>

<div id="hud">
  <button id="prev">&#8592;</button>
  <span id="leg-name">Crimson Red</span>
  <button id="next">&#8594;</button>
  <span id="leg-num">1 / 7</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function () {
  'use strict';

  // ─────────────────────────────────────────────────────────────────────────
  // BODY SCHEME — locked to Obsidian + Violet
  // ─────────────────────────────────────────────────────────────────────────
  const BODY = {
    ambient: 0xb0a0c8, dir1: 0xf0e8ff, dir2: 0x8060c0, rim: 0xd0b8f0,
    head:  { color: 0x6040a8, specular: 0xe8c0ff, shininess: 280, emissive: 0x100818, ei: 0.48 },
    body:  { color: 0x4a2e88, specular: 0xc090e8, shininess: 220, emissive: 0x0c0614, ei: 0.44 },
    tail:  { color: 0x583498, specular: 0xd0a8f8, shininess: 260, emissive: 0x0e0618, ei: 0.46 },
  };

  // ─────────────────────────────────────────────────────────────────────────
  // LEG VARIATIONS
  // ─────────────────────────────────────────────────────────────────────────
  const LEG_SCHEMES = [
    {
      name: 'Crimson Red',
      desc: 'Classic Chinese dragon — blood red with hot specular',
      color: 0x8b1818, specular: 0xff4040, shininess: 160, emissive: 0x1a0000, ei: 0.48,
      visible: true,
    },
    {
      name: 'Violet Match',
      desc: 'Seamless — legs blend with body',
      color: 0x4a2e88, specular: 0xc090e8, shininess: 220, emissive: 0x0c0614, ei: 0.44,
      visible: true,
    },
    {
      name: 'Deep Gold',
      desc: 'High-contrast accent — gold on violet',
      color: 0x7a5010, specular: 0xffe060, shininess: 300, emissive: 0x180c00, ei: 0.50,
      visible: true,
    },
    {
      name: 'Bone White',
      desc: 'Pale ivory — ethereal, ghostly',
      color: 0xc8c0a8, specular: 0xfff8f0, shininess: 240, emissive: 0x181410, ei: 0.30,
      visible: true,
    },
    {
      name: 'Glowing Magenta',
      desc: 'High emissive — legs pulse with energy',
      color: 0x6a1860, specular: 0xff80e8, shininess: 320, emissive: 0x4a0840, ei: 1.20,
      visible: true,
    },
    {
      name: 'Dark Teal',
      desc: 'Muted complement — cold contrast to warm violet',
      color: 0x1a5858, specular: 0x60d8c8, shininess: 200, emissive: 0x041010, ei: 0.40,
      visible: true,
    },
    {
      name: 'No Legs',
      desc: 'Minimalist — pure serpent, no limbs',
      color: 0x000000, specular: 0x000000, shininess: 0, emissive: 0x000000, ei: 0,
      visible: false,
    },
  ];

  let currentLeg = 0;

  // ─────────────────────────────────────────────────────────────────────────
  // RENDERER
  // ─────────────────────────────────────────────────────────────────────────
  const cv = document.getElementById('dragon-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
  camera.position.set(3, 0.15, 3);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ─────────────────────────────────────────────────────────────────────────
  // LIGHTS
  // ─────────────────────────────────────────────────────────────────────────
  const ambientLight = new THREE.AmbientLight(BODY.ambient, 2.2); scene.add(ambientLight);
  const dirLight1 = new THREE.DirectionalLight(BODY.dir1, 5.0);
  dirLight1.position.set(8, 15, 10); scene.add(dirLight1);
  const dirLight2 = new THREE.DirectionalLight(BODY.dir2, 1.8);
  dirLight2.position.set(-12, -5, -8); scene.add(dirLight2);
  const rimLight = new THREE.DirectionalLight(BODY.rim, 2.2);
  rimLight.position.set(0, 5, -15); scene.add(rimLight);

  // ─────────────────────────────────────────────────────────────────────────
  // MATERIALS
  // ─────────────────────────────────────────────────────────────────────────
  const mk = d => new THREE.MeshPhongMaterial({
    color: d.color, specular: d.specular, shininess: d.shininess,
    emissive: d.emissive, emissiveIntensity: d.ei
  });

  const matHead = mk(BODY.head);
  const matBody = mk(BODY.body);
  const matTail = mk(BODY.tail);
  const matLegs = mk(LEG_SCHEMES[0]);

  function applyLegScheme(idx) {
    const s = LEG_SCHEMES[idx];
    matLegs.color.set(s.color);
    matLegs.specular.set(s.specular);
    matLegs.shininess   = s.shininess;
    matLegs.emissive.set(s.emissive);
    matLegs.emissiveIntensity = s.ei;
    matLegs.needsUpdate = true;
    jiao.forEach(m => { m.visible = s.visible; });
    document.getElementById('leg-name').textContent = s.name;
    document.getElementById('leg-num').textContent  = `${idx + 1} / ${LEG_SCHEMES.length}`;
  }

  // ─────────────────────────────────────────────────────────────────────────
  // LOAD MESHES
  // ─────────────────────────────────────────────────────────────────────────
  const loader = new THREE.STLLoader();
  let tou, wei;
  const jiao  = [];
  const meshB = [];
  const BNUM  = 14;

  loader.load('./tou.stl', geo => {
    tou = new THREE.Mesh(geo, matHead);
    tou.scale.set(0.15, 0.15, 0.15);
    tou.rotation.set(-Math.PI / 2, 0, 0);
    scene.add(tou);
  });

  loader.load('./wei.stl', geo => {
    wei = new THREE.Mesh(geo, matTail);
    wei.scale.set(0.11, 0.11, 0.11);
    wei.rotation.set(-Math.PI / 2, 0, 0);
    scene.add(wei);
  });

  for (let i = 0; i < 4; i++) {
    loader.load((i === 0 || i === 2) ? './jiao.stl' : './jiao2.stl', geo => {
      const m = new THREE.Mesh(geo, matLegs);
      m.scale.set(0.12, 0.12, 0.12);
      m.rotation.set(-Math.PI / 2, 0, -Math.PI / 2);
      jiao.push(m);
      scene.add(m);
    });
  }

  for (let i = 0; i < BNUM; i++) {
    loader.load('./bodyy.stl', geo => {
      const m = new THREE.Mesh(geo, mk(BODY.body));
      m.scale.set(0.2, 0.1, 0.2);
      m.rotation.set(-Math.PI / 2, 0, 0);
      meshB.push(m);
      scene.add(m);
    });
  }

  // ─────────────────────────────────────────────────────────────────────────
  // CONTROLS
  // ─────────────────────────────────────────────────────────────────────────
  function go(dir) {
    currentLeg = (currentLeg + dir + LEG_SCHEMES.length) % LEG_SCHEMES.length;
    applyLegScheme(currentLeg);
  }
  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(+1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  go(-1);
    if (e.key === 'ArrowRight') go(+1);
  });

  // ─────────────────────────────────────────────────────────────────────────
  // ANIMATION
  // ─────────────────────────────────────────────────────────────────────────
  const clock = new THREE.Clock();

  function render() {
    const T = clock.getElapsedTime();

    if (tou) {
      const t = 0.2 * (T + 0.6);
      tou.position.set(Math.cos(t)*15, Math.cos(3*t)-4.5, Math.sin(t)*15);
      tou.rotation.y = Math.sin(t) > 0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      tou.rotation.z = -t;
    }

    if (jiao.length === 4) {
      const doLeg = (m, lag, r) => {
        const t = 0.2 * (T - lag);
        m.position.set(Math.cos(t)*r, Math.cos(3*t)-7, Math.sin(t)*r);
        m.rotation.y = Math.sin(t) > 0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
        m.rotation.z = -t;
      };
      doLeg(jiao[0], 1.5, 17); doLeg(jiao[1], 1.5, 13);
      doLeg(jiao[2], 4.5, 17); doLeg(jiao[3], 4.5, 13);
    }

    for (let i = 0; i < meshB.length; i++) {
      const t = 0.2 * (T - 0.6 * i);
      if (i > 8) {
        meshB[i].scale.x = 0.2 - (i-8)*0.015;
        meshB[i].scale.z = 0.2 - (i-8)*0.015;
        meshB[i].scale.y = (0.2-(i-8)*0.02) * (0.3-0.07*Math.abs(Math.cos(3*t)));
      } else {
        meshB[i].scale.y = 0.3 - 0.07*Math.abs(Math.cos(3*t));
      }
      meshB[i].position.set(Math.cos(t)*15, Math.cos(3*t)-5, Math.sin(t)*15);
      meshB[i].rotation.y = Math.sin(t) > 0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      meshB[i].rotation.z = -t;
    }

    if (wei) {
      const t = 0.2 * (T - 0.6*BNUM + 0.1);
      wei.position.set(Math.cos(t)*15, Math.cos(3*t)-5, Math.sin(t)*15);
      wei.rotation.y = Math.sin(t) > 0 ? -Math.atan(Math.sin(3*t)*0.4) : Math.atan(Math.sin(3*t)*0.4);
      wei.rotation.z = -t;
    }

    camera.position.x = 30 + Math.cos(0.3*T)*5;
    camera.position.y = Math.sin(0.3*T)*5 - 5;
    camera.lookAt(new THREE.Vector3(0, -5, 0));

    renderer.render(scene, camera);
  }

  function animate() { requestAnimationFrame(animate); render(); }
  animate();
})();
</script>
</body>
</html>
