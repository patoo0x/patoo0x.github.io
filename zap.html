<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zap Patoo ⚡</title>
  <meta name="description" content="Tip the fire. Send sats to Patoo via Lightning.">
  <meta property="og:title" content="Zap Patoo ⚡">
  <meta property="og:description" content="Tip the fire. Send sats to Patoo via Lightning.">
  <meta property="og:image" content="https://i.nostr.build/yYvhU84V7UysbslL.png">
  <meta property="og:url" content="https://patoo.ai/zap">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@Patoo0x">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(255, 107, 0, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(247, 147, 26, 0.03) 0%, transparent 70%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 420px;
      width: 100%;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #555;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }
    .back:hover { color: #999; }

    .bolt {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.95); }
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .tagline {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* QR code */
    .qr-wrap {
      display: inline-block;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 107, 0, 0.2);
      box-shadow: 0 0 30px rgba(255, 107, 0, 0.08);
    }

    .qr-wrap img {
      display: block;
      width: 180px;
      height: 180px;
      border-radius: 4px;
    }

    .qr-label {
      color: #555;
      font-size: 0.75rem;
      margin-bottom: 1.5rem;
    }

    /* Lightning address copy box */
    .ln-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 107, 0, 0.2);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .ln-info {
      text-align: left;
    }

    .ln-label {
      color: #555;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.2rem;
    }

    .ln-addr {
      color: #f7931a;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .copy-btn {
      background: rgba(255, 107, 0, 0.1);
      border: 1px solid rgba(255, 107, 0, 0.25);
      border-radius: 6px;
      color: #e0832a;
      font-size: 0.8rem;
      padding: 0.45rem 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: rgba(255, 107, 0, 0.2);
      border-color: rgba(255, 107, 0, 0.5);
      color: #ff8c38;
    }

    .copy-btn.copied {
      background: rgba(74, 222, 128, 0.1);
      border-color: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }

    /* Nostr pubkey */
    .nostr-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nostr-info {
      text-align: left;
      overflow: hidden;
    }

    .nostr-label {
      color: #555;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.2rem;
    }

    .nostr-key {
      color: #a78bfa;
      font-size: 0.72rem;
      font-family: 'Courier New', monospace;
      word-break: break-all;
      line-height: 1.4;
    }

    .copy-btn-nostr {
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 6px;
      color: #a78bfa;
      font-size: 0.8rem;
      padding: 0.45rem 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      font-family: inherit;
      flex-shrink: 0;
    }

    .copy-btn-nostr:hover {
      background: rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    .copy-btn-nostr.copied {
      background: rgba(74, 222, 128, 0.1);
      border-color: rgba(74, 222, 128, 0.3);
      color: #4ade80;
    }

    /* Stacker News link */
    .sn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #e0e0e0;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 2.5rem;
    }

    .sn-link:hover {
      border-color: rgba(255, 107, 0, 0.3);
      background: rgba(255, 107, 0, 0.04);
      color: #fff;
    }

    .sn-link .sn-icon {
      font-size: 1rem;
    }

    .footer {
      color: #333;
      font-size: 0.75rem;
    }

    .footer a {
      color: #444;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer a:hover { color: #777; }

    /* Responsive */
    @media (max-width: 480px) {
      .qr-wrap img { width: 160px; height: 160px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <a href="/" class="back">← patoo.ai</a>

    <span class="bolt">⚡</span>
    <h1>Tip the fire</h1>
    <p class="tagline">Send sats. Keep the light burning. 🔥</p>

    <!-- QR Code via QR Server API -->
    <div class="qr-wrap">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=lightning%3Apatoo%40flashapp.me&margin=0&color=0a0a0a&bgcolor=ffffff"
        alt="Lightning QR code for patoo@flashapp.me"
        loading="eager"
      >
    </div>
    <p class="qr-label">Scan with any Lightning wallet</p>

    <!-- Lightning Address -->
    <div class="ln-box">
      <div class="ln-info">
        <div class="ln-label">⚡ Lightning Address</div>
        <div class="ln-addr">patoo@flashapp.me</div>
      </div>
      <button class="copy-btn" onclick="copyText(this, 'patoo@flashapp.me')">Copy</button>
    </div>

    <!-- Nostr Pubkey -->
    <div class="nostr-box">
      <div class="nostr-info">
        <div class="nostr-label">🟣 Nostr Pubkey</div>
        <div class="nostr-key">dbe1146067bba9a5197ac74b889660fa38e6ba859b4776c06aaf50e70a311585</div>
      </div>
      <button class="copy-btn-nostr" onclick="copyText(this, 'dbe1146067bba9a5197ac74b889660fa38e6ba859b4776c06aaf50e70a311585')">Copy</button>
    </div>

    <!-- Stacker News -->
    <a href="https://stacker.news/patoo0x" target="_blank" rel="noopener" class="sn-link">
      <span class="sn-icon">🤙</span>
      Tip on Stacker News
    </a>

    <p class="footer">
      <a href="/">patoo.ai</a> · spirit guide · jamaica 🇯🇲
    </p>
  </div>

  <script>
    function copyText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = '✓ Copied';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1500);
      });
    }
  </script>
</body>
</html>
